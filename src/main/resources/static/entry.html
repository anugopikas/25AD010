<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VisitorPass - Entry Exit</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>


<header class="header">

    <div class="logo">
        VisitorPass
    </div>

    <div class="subtitle">
        Visitor Entry / Exit Management
    </div>

</header>


<nav class="navbar">

    <a href="/index.html">Dashboard</a>

    <a href="/resident.html">Residents</a>

    <a href="/visitor.html">Visitors</a>

    <a href="/gate.html">Gate Verification</a>

    <a href="/entry.html">Entry / Exit</a>

    <a href="/guard.html">Security Guards</a>

</nav>


<main class="container">


    <div class="card">

        <h2>
            Record Visitor Exit
        </h2>


        <form id="exitForm">

            <div class="form-grid">

                <input
                        type="text"
                        id="exitPhone"
                        placeholder="Enter visitor phone number"
                        required>


                <button
                        type="submit">

                    Record Exit

                </button>

            </div>

        </form>

    </div>



    <div class="card">

        <h2>
            Entry / Exit History
        </h2>


        <div class="table-wrapper">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Phone</th>

                    <th>Entry Time</th>

                    <th>Exit Time</th>

                    <th>Status</th>

                </tr>

                </thead>


                <tbody id="entryTableBody">

                </tbody>

            </table>

        </div>

    </div>


</main>


<script src="/js/script.js"></script>

</body>

</html>

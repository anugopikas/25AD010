<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VisitorPass - Entry / Exit</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>


<!-- HEADER -->

<header class="header">

    <div class="logo">
        VisitorPass
    </div>

    <div class="subtitle">
        Visitor Management
    </div>

</header>


<!-- NAVIGATION -->

<nav class="navbar">

    <a href="/index.html">
        Dashboard
    </a>

    <a href="/resident.html">
        Residents
    </a>

    <a href="/visitor.html">
        Visitors
    </a>

    <a href="/gate.html">
        Gate Verification
    </a>

    <a href="/entry.html">
        Entry / Exit
    </a>

    <a href="/guard.html">
        Security Guards
    </a>

</nav>


<!-- MAIN -->

<main class="container">


    <!-- EXIT FORM -->

    <div class="card">

        <h2>
            Visitor Entry / Exit
        </h2>

        <form id="exitForm">

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Visitor Phone Number
                    </label>

                    <input
                            type="text"
                            id="phone"
                            placeholder="Visitor Phone Number"
                            maxlength="10"
                            required
                    >

                </div>

            </div>


            <button type="submit">
                Record Exit
            </button>

        </form>

    </div>


    <!-- RESULT -->

    <div class="card">

        <h2>
            Exit Result
        </h2>

        <p id="message">
            Enter visitor phone number and record exit.
        </p>

    </div>


    <!-- ENTRY RECORDS -->

    <div class="card">

        <h2>
            Entry / Exit Records
        </h2>


        <div class="table-wrapper">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Phone</th>

                    <th>Entry Time</th>

                    <th>Exit Time</th>

                    <th>Status</th>

                </tr>

                </thead>


                <tbody id="entryTable">

                </tbody>

            </table>

        </div>

    </div>


</main>


<script>


    /* =========================================
       LOAD ENTRY / EXIT RECORDS
       ========================================= */

    function loadEntries() {


        fetch("/api/entry/getall")


            .then(response => {


                if (!response.ok) {

                    throw new Error(
                        "Entry API error: "
                        + response.status
                    );

                }


                return response.json();

            })


            .then(data => {


                const table =
                    document.getElementById(
                        "entryTable"
                    );


                table.innerHTML = "";


                if (!Array.isArray(data)) {

                    throw new Error(
                        "Invalid entry data"
                    );

                }


                data.forEach(entry => {


                    const id =
                        entry.Id ??
                        entry.id ??
                        "";


                    const phone =
                        entry.phone ??
                        "";


                    const entryTime =
                        entry.entryTime ??
                        "";


                    const exitTime =
                        entry.exitTime ??
                        "-";


                    const status =
                        entry.status ??
                        "";


                    const row =
                        document.createElement(
                            "tr"
                        );


                    row.innerHTML = `

                    <td>
                        ${id}
                    </td>

                    <td>
                        ${phone}
                    </td>

                    <td>
                        ${entryTime}
                    </td>

                    <td>
                        ${exitTime}
                    </td>

                    <td>
                        ${status}
                    </td>

                `;


                    table.appendChild(row);

                });

            })


            .catch(error => {


                console.error(
                    "Load Entry Error:",
                    error
                );


                /*
                 * Table loading error மட்டும் alert
                 */

                alert(
                    "Unable to load entry records"
                );

            });

    }


    /* =========================================
       RECORD EXIT
       ========================================= */

    document
        .getElementById("exitForm")
        .addEventListener(
            "submit",
            function(event) {


                event.preventDefault();


                const phone =
                    document
                        .getElementById("phone")
                        .value
                        .trim();


                const message =
                    document.getElementById(
                        "message"
                    );


                /* =========================
                   PHONE VALIDATION
                   ========================= */

                if (
                    !/^[0-9]{10}$/.test(phone)
                ) {


                    alert(
                        "Please enter a valid 10 digit phone number"
                    );


                    return;

                }


                message.innerText =
                    "Recording visitor exit...";


                /* =========================
                   EXIT API
                   ========================= */

                fetch(
                    "/api/entry/exit?phone="
                    + encodeURIComponent(phone),
                    {

                        method: "POST"

                    }
                )


                    .then(response => {


                        return response.text()
                            .then(data => ({

                                ok:
                                response.ok,

                                status:
                                response.status,

                                data:
                                data

                            }));

                    })


                    .then(result => {


                        /* =========================
                           ERROR RESPONSE
                           ========================= */

                        if (!result.ok) {


                            console.error(
                                "Exit API Error:",
                                result.status,
                                result.data
                            );


                            alert(
                                result.data ||
                                "Exit failed"
                            );


                            message.innerText =
                                "Exit failed";


                            return;

                        }


                        /* =========================
                           SUCCESS
                           NO POPUP
                           ========================= */

                        message.innerText =
                            result.data ||
                            "Visitor exit recorded successfully";


                        /*
                         * Clear phone input
                         */

                        document
                            .getElementById("phone")
                            .value = "";


                        /*
                         * Refresh table
                         */

                        loadEntries();

                    })


                    .catch(error => {


                        console.error(
                            "Exit Connection Error:",
                            error
                        );


                        /*
                         * CONNECTION ERROR
                         * ONLY HERE ALERT
                         */

                        alert(
                            "Unable to connect to server"
                        );


                        message.innerText =
                            "Exit failed";

                    });

            }
        );


    /* =========================================
       INITIAL LOAD
       ========================================= */

    loadEntries();


</script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VisitorPass - Dashboard</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<header class="header">

    <div class="logo">
        VisitorPass
    </div>

    <div class="subtitle">
        Visitor Entry / Exit Management
    </div>

</header>


<nav class="navbar">

    <a href="/index.html">
        Dashboard
    </a>

    <a href="/resident.html">
        Residents
    </a>

    <a href="/visitor.html">
        Visitors
    </a>

    <a href="/entry.html">
        Entry / Exit
    </a>

    <a href="/guard.html">
        Security Guards
    </a>

</nav>


<main class="container">

    <div class="card">

        <h2>
            Dashboard
        </h2>

        <p>
            VisitorPass Security Management System
        </p>

    </div>


    <div class="dashboard">

        <div class="stat-card">

            <div class="stat-title">
                Total Residents
            </div>

            <div id="residentCount"
                 class="stat-number">
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                Total Visitors
            </div>

            <div id="visitorCount"
                 class="stat-number">
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                Entry Records
            </div>

            <div id="entryCount"
                 class="stat-number">
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                Security Guards
            </div>

            <div id="guardCount"
                 class="stat-number">
                0
            </div>

        </div>

    </div>


    <div class="dashboard"
         style="margin-top:20px;">

        <div class="stat-card">

            <div class="stat-title">
                Currently Inside
            </div>

            <div id="inCount"
                 class="stat-number">
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                Visitors Exited
            </div>

            <div id="outCount"
                 class="stat-number">
                0
            </div>

        </div>

    </div>

</main>


<script src="/js/script.js"></script>

</body>

</html>

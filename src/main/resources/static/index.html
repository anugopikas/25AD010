<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VisitorPass - Dashboard</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<header>

    <h1>VisitorPass</h1>

    <p>Gated Community Visitor Management System</p>

</header>


<nav>

    <a href="/index.html">Dashboard</a>

    <a href="/resident.html">Residents</a>

    <a href="/visitor.html">Visitors</a>

    <a href="/gate.html">Gate Verification</a>

    <a href="/entry.html">Entry / Exit</a>

    <a href="/guard.html">Security Guards</a>

</nav>


<div class="container">

    <h2>Dashboard</h2>


    <div class="card-container">

        <div class="card">
            <h3>Total Residents</h3>
            <p id="residentCount">0</p>
        </div>


        <div class="card">
            <h3>Total Visitors</h3>
            <p id="visitorCount">0</p>
        </div>


        <div class="card">
            <h3>Entry Records</h3>
            <p id="entryCount">0</p>
        </div>


        <div class="card">
            <h3>Security Guards</h3>
            <p id="guardCount">0</p>
        </div>


        <div class="card">
            <h3>Visitors Inside</h3>
            <p id="inCount">0</p>
        </div>


        <div class="card">
            <h3>Visitors Exited</h3>
            <p id="outCount">0</p>
        </div>

    </div>


    <div class="quick-actions">

        <h2>Quick Actions</h2>

        <a href="/resident.html">
            <button>Add Resident</button>
        </a>

        <a href="/visitor.html">
            <button>Add Visitor</button>
        </a>

        <a href="/gate.html">
            <button>Gate Verification</button>
        </a>

        <a href="/entry.html">
            <button>Record Exit</button>
        </a>

    </div>

</div>


<script src="/js/script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VisitorPass - Visitors</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        VisitorPass
    </div>

    <div class="subtitle">
        Visitor Entry / Exit Management
    </div>

</header>


<nav class="navbar">

    <a href="/index.html">Dashboard</a>

    <a href="/resident.html">Residents</a>

    <a href="/visitor.html">Visitors</a>

    <a href="/gate.html">Gate Verification</a>

    <a href="/entry.html">Entry / Exit</a>

    <a href="/guard.html">Security Guards</a>

</nav>


<main class="container">


    <!-- PAGE TITLE -->

    <div class="card">

        <h2>Visitor Management</h2>

        <p>
            Create and view visitor pre-approvals
        </p>

    </div>


    <!-- ADD VISITOR -->

    <div class="card">

        <h2>Add Visitor</h2>

        <form id="visitorForm">

            <div class="form-grid">


                <!-- VISITOR NAME -->

                <div class="form-group">

                    <label for="name">
                        Visitor Name
                    </label>

                    <input
                            type="text"
                            id="name"
                            placeholder="Enter visitor name"
                            required
                    >

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                            type="text"
                            id="phone"
                            placeholder="Enter 10 digit phone number"
                            maxlength="10"
                            required
                    >

                </div>


                <!-- VISIT DATE -->

                <div class="form-group">

                    <label for="visitDate">
                        Visit Date
                    </label>

                    <input
                            type="date"
                            id="visitDate"
                            required
                    >

                </div>


                <!-- FROM TIME -->

                <div class="form-group">

                    <label for="fromTime">
                        From Time
                    </label>

                    <input
                            type="time"
                            id="fromTime"
                            required
                    >

                </div>


                <!-- TO TIME -->

                <div class="form-group">

                    <label for="toTime">
                        To Time
                    </label>

                    <input
                            type="time"
                            id="toTime"
                            required
                    >

                </div>


                <!-- FLAT ID -->

                <div class="form-group">

                    <label for="flatId">
                        Flat ID
                    </label>

                    <input
                            type="number"
                            id="flatId"
                            placeholder="Enter flat ID"
                            required
                    >

                </div>

            </div>


            <button type="submit">
                Add Visitor
            </button>

        </form>


        <p id="message"></p>

    </div>


    <!-- VISITOR LIST -->

    <div class="card">

        <h2>Visitor List</h2>

        <div class="table-wrapper">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Phone</th>

                    <th>Visit Date</th>

                    <th>From Time</th>

                    <th>To Time</th>

                    <th>Flat ID</th>

                </tr>

                </thead>


                <tbody id="visitorTable">

                </tbody>

            </table>

        </div>

    </div>


</main>


<script src="/js/script.js"></script>

</body>

</html>

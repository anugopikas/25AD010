<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VisitorPass - Visitors</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<header class="header">

    <div class="logo">
        VisitorPass
    </div>

    <div class="subtitle">
        Visitor Entry / Exit Management
    </div>

</header>


<nav class="navbar">

    <a href="/index.html">
        Dashboard
    </a>

    <a href="/resident.html">
        Residents
    </a>

    <a href="/visitor.html">
        Visitors
    </a>

    <a href="/entry.html">
        Entry / Exit
    </a>

    <a href="/guard.html">
        Security Guards
    </a>

</nav>


<main class="container">

    <div class="card">

        <h2>
            Visitor Management
        </h2>

        <p>
            Create and view visitor pre-approvals
        </p>

    </div>


    <div class="card">

        <h2>
            Add Visitor
        </h2>

        <form id="visitorForm">

            <label>Visitor Name</label>

            <input
                    type="text"
                    id="name"
                    required
            >


            <label>Phone</label>

            <input
                    type="text"
                    id="phone"
                    required
            >


            <label>Visit Date</label>

            <input
                    type="date"
                    id="visitDate"
                    required
            >


            <label>From Time</label>

            <input
                    type="time"
                    id="fromTime"
                    required
            >


            <label>To Time</label>

            <input
                    type="time"
                    id="toTime"
                    required
            >


            <label>Flat ID</label>

            <input
                    type="number"
                    id="flatId"
                    required
            >


            <button type="submit">
                Add Visitor
            </button>

        </form>

        <p id="message"></p>

    </div>


    <div class="card">

        <h2>
            Visitor List
        </h2>

        <table>

            <thead>

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Visit Date</th>
                <th>From Time</th>
                <th>To Time</th>
                <th>Flat ID</th>

            </tr>

            </thead>


            <tbody id="visitorTable">

            </tbody>

        </table>

    </div>

</main>


<script>

    function loadVisitors() {

        fetch("/api/visitor/getall")

            .then(response => response.json())

            .then(data => {

                let table =
                    document.getElementById("visitorTable");

                table.innerHTML = "";

                data.forEach(visitor => {

                    let row =
                        document.createElement("tr");

                    row.innerHTML = `

                        <td>${visitor.id}</td>

                        <td>${visitor.name}</td>

                        <td>${visitor.phone}</td>

                        <td>${visitor.visitDate}</td>

                        <td>${visitor.fromTime}</td>

                        <td>${visitor.toTime}</td>

                        <td>${visitor.flatId}</td>

                    `;

                    table.appendChild(row);

                });

            })

            .catch(error => {

                console.error(
                    "Visitor API Error:",
                    error
                );

            });

    }


    document
        .getElementById("visitorForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            let visitor = {

                name:
                document.getElementById("name").value,

                phone:
                document.getElementById("phone").value,

                visitDate:
                document.getElementById("visitDate").value,

                fromTime:
                document.getElementById("fromTime").value,

                toTime:
                document.getElementById("toTime").value,

                flatId:
                    Number(
                        document.getElementById("flatId").value
                    )

            };


            fetch("/api/visitor/create

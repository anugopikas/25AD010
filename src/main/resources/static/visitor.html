<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VisitorPass - Visitors</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>


<header class="header">

    <div class="logo">
        VisitorPass
    </div>

    <div class="subtitle">
        Visitor Pre-Approval
    </div>

</header>


<nav class="navbar">

    <a href="/index.html">Dashboard</a>

    <a href="/resident.html">Residents</a>

    <a href="/visitor.html">Visitors</a>

    <a href="/gate.html">Gate Verification</a>

    <a href="/entry.html">Entry / Exit</a>

    <a href="/guard.html">Security Guards</a>

</nav>


<main class="container">


    <div class="card">

        <h2>
            Pre-Approve Visitor
        </h2>


        <form id="visitorForm">

            <div class="form-grid">


                <input
                        type="text"
                        id="visitorName"
                        placeholder="Visitor Name"
                        required>


                <input
                        type="text"
                        id="visitorPhone"
                        placeholder="Phone Number"
                        required>


                <input
                        type="date"
                        id="visitDate"
                        required>


                <input
                        type="time"
                        id="fromTime"
                        required>


                <input
                        type="time"
                        id="toTime"
                        required>


                <input
                        type="number"
                        id="flatId"
                        placeholder="Flat ID"
                        required>


            </div>


            <br>


            <button
                    type="submit"
                    class="full-button">

                Approve Visitor

            </button>

        </form>

    </div>



    <div class="card">

        <h2>
            Approved Visitors
        </h2>


        <div class="table-wrapper">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Phone</th>

                    <th>Date</th>

                    <th>From</th>

                    <th>To</th>

                    <th>Flat ID</th>

                </tr>

                </thead>


                <tbody id="visitorTableBody">

                </tbody>

            </table>

        </div>

    </div>


</main>


<script src="/js/script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VisitorPass - Gate Verification</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>


<!-- HEADER -->

<header class="header">

    <div class="logo">
        VisitorPass
    </div>

    <div class="subtitle">
        Visitor Management
    </div>

</header>


<!-- NAVIGATION -->

<nav class="navbar">

    <a href="/index.html">
        Dashboard
    </a>

    <a href="/resident.html">
        Residents
    </a>

    <a href="/visitor.html">
        Visitors
    </a>

    <a href="/gate.html">
        Gate Verification
    </a>

    <a href="/entry.html">
        Entry / Exit
    </a>

    <a href="/guard.html">
        Security Guards
    </a>

</nav>


<!-- MAIN -->

<main class="container">


    <!-- GATE VERIFICATION -->

    <div class="card">

        <h2>
            Gate Verification
        </h2>

        <form id="gateForm">


            <div class="form-grid">


                <div class="form-group">

                    <label>
                        Visitor Phone Number
                    </label>

                    <input
                            type="text"
                            id="phone"
                            placeholder="Visitor Phone Number"
                            maxlength="10"
                            required
                    >

                </div>


            </div>


            <button type="submit">
                Verify Visitor
            </button>


        </form>

    </div>


    <!-- VERIFICATION RESULT -->

    <div class="card">

        <h2>
            Verification Result
        </h2>

        <p id="message">
            Enter visitor phone number and verify.
        </p>

    </div>


</main>


<script>


    document
        .getElementById("gateForm")
        .addEventListener(
            "submit",
            function(event) {


                event.preventDefault();


                let phone =
                    document
                        .getElementById("phone")
                        .value
                        .trim();


                let message =
                    document.getElementById(
                        "message"
                    );


                /* VALIDATE PHONE */

                if (phone === "") {

                    message.innerText =
                        "Please enter visitor phone number";

                    return;

                }


                if (!/^[0-9]{10}$/.test(phone)) {

                    message.innerText =
                        "Please enter a valid 10 digit phone number";

                    return;

                }


                message.innerText =
                    "Verifying visitor...";


                /* GATE API */

                fetch(
                    "/api/gate/verify?phone="
                    + encodeURIComponent(phone),
                    {

                        method: "POST"

                    }
                )


                    .then(response => {

                        return response.text();

                    })


                    .then(data => {

                        message.innerText =
                            data;

                    })


                    .catch(error => {

                        console.error(
                            "Gate Verification Error:",
                            error
                        );


                        message.innerText =
                            "Unable to connect to server";

                    });

            }
        );


</script>


</body>

</html>

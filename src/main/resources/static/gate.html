<script>

    document.getElementById("gateForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const phone = document.getElementById("gatePhone").value.trim();
        const result = document.getElementById("gateResult");

        console.log("Phone entered:", phone);

        if (phone === "") {
            result.style.display = "block";
            result.innerText = "Please enter phone number";
            return;
        }

        result.style.display = "block";
        result.innerText = "Verifying...";

        try {

            const response = await fetch(
                "http://localhost:8081/api/gate/verify?phone=" +
                encodeURIComponent(phone),
                {
                    method: "POST"
                }
            );

            console.log("HTTP Status:", response.status);

            const message = await response.text();

            console.log("Backend Response:", message);

            result.style.display = "block";
            result.innerText = message;

            if (message.includes("Entry Allowed")) {
                result.style.background = "#d1fae5";
                result.style.color = "#065f46";
            } else {
                result.style.background = "#fee2e2";
                result.style.color = "#991b1b";
            }

        } catch (error) {

            console.error("ERROR:", error);

            result.style.display = "block";
            result.innerText =
                "Cannot connect to backend: " + error.message;

            result.style.background = "#fee2e2";
            result.style.color = "#991b1b";
        }

    });

</script>

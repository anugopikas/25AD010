<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VisitorPass - Security Guards</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
        }

        header {
            background-color: #1f4e79;
            color: white;
            padding: 20px 40px;
        }

        nav {
            background-color: white;
            padding: 15px 40px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        nav a {
            text-decoration: none;
            color: #333;
            margin-right: 25px;
            font-weight: bold;
        }

        .container {
            padding: 30px 40px;
        }

        .box {
            background-color: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 12px;
            background-color: #1f4e79;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #163a5c;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #1f4e79;
            color: white;
        }

        .delete-btn {
            background-color: #c0392b;
            padding: 8px 15px;
        }

        @media (max-width: 700px) {
            .form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>VisitorPass</h1>
    <p>Security Guard Management</p>
</header>

<nav>
    <a href="index.html">Dashboard</a>
    <a href="resident.html">Residents</a>
    <a href="visitor.html">Visitors</a>
    <a href="gate.html">Gate Verification</a>
    <a href="entry.html">Entry / Exit</a>
    <a href="guard.html">Security Guards</a>
</nav>

<div class="container">

    <div class="box">

        <h2>Add Security Guard</h2>

        <div class="form">

            <input
                    type="text"
                    id="name"
                    placeholder="Guard Name">

            <input
                    type="text"
                    id="phone"
                    placeholder="Phone Number">

            <input
                    type="email"
                    id="email"
                    placeholder="Email">

            <input
                    type="text"
                    id="address"
                    placeholder="Address">

            <input
                    type="text"
                    id="shift"
                    placeholder="Shift">

            <button onclick="createGuard()">
                Add Guard
            </button>

        </div>

        <p id="message"></p>

    </div>


    <div class="box">

        <h2>Security Guards</h2>

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Address</th>
                <th>Shift</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody id="guardTable">
            </tbody>

        </table>

    </div>

</div>


<script>

    function createGuard() {

        const guard = {

            Name: document.getElementById("name").value,

            Phone: document.getElementById("phone").value,

            Email: document.getElementById("email").value,

            Address: document.getElementById("address").value,

            Shift: document.getElementById("shift").value

        };


        fetch("/api/guard/create", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(guard)

        })

            .then(response => response.json())

            .then(data => {

                document.getElementById("message").innerText =
                    "Security Guard added successfully";

                document.getElementById("name").value = "";
                document.getElementById("phone").value = "";
                document.getElementById("email").value = "";
                document.getElementById("address").value = "";
                document.getElementById("shift").value = "";

                loadGuards();

            })

            .catch(error => {

                document.getElementById("message").innerText =
                    "Error adding security guard";

                console.error(error);

            });
    }


    function loadGuards() {

        fetch("/api/guard/getall")

            .then(response => response.json())

            .then(data => {

                const table =
                    document.getElementById("guardTable");

                table.innerHTML = "";

                data.forEach(guard => {

                    const row = `
                    <tr>
                        <td>${guard.id}</td>
                        <td>${guard.name}</td>
                        <td>${guard.phone}</td>
                        <td>${guard.email}</td>
                        <td>${guard.address}</td>
                        <td>${guard.shift}</td>
                        <td>
                            <button
                                class="delete-btn"
                                onclick="deleteGuard(${guard.id})">
                                Delete
                            </button>
                        </td>
                    </tr>
                `;

                    table.innerHTML += row;

                });

            })

            .catch(error => {
                console.error("Error loading guards:", error);
            });
    }


    function deleteGuard(id) {

        if (!confirm("Are you sure you want to delete this guard?")) {
            return;
        }

        fetch("/api/guard/delete/" + id, {

            method: "DELETE"

        })

            .then(response => response.text())

            .then(data => {

                document.getElementById("message").innerText =
                    data;

                loadGuards();

            })

            .catch(error => {

                document.getElementById("message").innerText =
                    "Error deleting guard";

                console.error(error);

            });
    }


    loadGuards();

</script>

</body>
</html>

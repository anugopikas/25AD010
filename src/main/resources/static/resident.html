<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VisitorPass - Residents</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<header class="header">

    <div class="logo">
        VisitorPass
    </div>

    <div class="subtitle">
        Visitor Entry / Exit Management
    </div>

</header>


<nav class="navbar">

    <a href="/index.html">
        Dashboard
    </a>

    <a href="/resident.html">
        Residents
    </a>

    <a href="/visitor.html">
        Visitors
    </a>

    <a href="/entry.html">
        Entry / Exit
    </a>

    <a href="/guard.html">
        Security Guards
    </a>

</nav>


<main class="container">

    <div class="card">

        <h2>
            Resident Management
        </h2>

        <p>
            Add and view residents
        </p>

    </div>


    <div class="card">

        <h2>
            Add Resident
        </h2>

        <form id="residentForm">

            <label>Name</label>

            <input
                    type="text"
                    id="name"
                    required
            >


            <label>Phone</label>

            <input
                    type="text"
                    id="phone"
                    required
            >


            <label>Email</label>

            <input
                    type="email"
                    id="email"
                    required
            >


            <label>Address</label>

            <input
                    type="text"
                    id="address"
                    required
            >


            <label>Flat ID</label>

            <input
                    type="number"
                    id="flatId"
                    required
            >


            <button type="submit">
                Add Resident
            </button>

        </form>

        <p id="message"></p>

    </div>


    <div class="card">

        <h2>
            Resident List
        </h2>

        <table>

            <thead>

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Address</th>
                <th>Flat ID</th>

            </tr>

            </thead>


            <tbody id="residentTable">

            </tbody>

        </table>

    </div>

</main>


<script>

    function loadResidents() {

        fetch("/api/resident/getall")

            .then(response => response.json())

            .then(data => {

                let table =
                    document.getElementById("residentTable");

                table.innerHTML = "";

                data.forEach(resident => {

                    let row =
                        document.createElement("tr");

                    row.innerHTML = `

                        <td>${resident.id}</td>

                        <td>${resident.name}</td>

                        <td>${resident.phone}</td>

                        <td>${resident.email}</td>

                        <td>${resident.address}</td>

                        <td>${resident.flatId}</td>

                    `;

                    table.appendChild(row);

                });

            })

            .catch(error => {

                console.error(
                    "Resident API Error:",

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VisitorPass - Residents</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<header class="header">

    <div class="logo">
        VisitorPass
    </div>

    <div class="subtitle">
        Visitor Entry / Exit Management
    </div>

</header>


<nav class="navbar">

    <a href="/index.html">
        Dashboard
    </a>

    <a href="/resident.html">
        Residents
    </a>

    <a href="/visitor.html">
        Visitors
    </a>

    <a href="/gate.html">
        Gate Verification
    </a>

    <a href="/entry.html">
        Entry / Exit
    </a>

    <a href="/guard.html">
        Security Guards
    </a>

</nav>


<main class="container">


    <!-- RESIDENT MANAGEMENT -->

    <div class="card">

        <h2>
            Resident Management
        </h2>

        <p>
            Add and view residents
        </p>

    </div>


    <!-- ADD RESIDENT -->

    <div class="card">

        <h2>
            Add Resident
        </h2>


        <form id="residentForm">


            <div class="form-grid">


                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                            type="text"
                            id="name"
                            placeholder="Enter resident name"
                            required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                            type="text"
                            id="phone"
                            placeholder="Enter 10 digit phone"
                            maxlength="10"
                            required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                            type="email"
                            id="email"
                            placeholder="Enter email"
                            required
                    >

                </div>


                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <input
                            type="text"
                            id="address"
                            placeholder="Enter address"
                            required
                    >

                </div>


                <div class="form-group">

                    <label for="flatId">
                        Flat ID
                    </label>

                    <input
                            type="number"
                            id="flatId"
                            placeholder="Enter flat ID"
                            required
                    >

                </div>


            </div>


            <button type="submit">
                Add Resident
            </button>


        </form>


        <p id="message"></p>


    </div>


    <!-- RESIDENT LIST -->

    <div class="card">

        <h2>
            Resident List
        </h2>


        <div class="table-wrapper">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Phone</th>

                    <th>Email</th>

                    <th>Address</th>

                    <th>Flat ID</th>

                </tr>

                </thead>


                <tbody id="residentTable">

                </tbody>


            </table>

        </div>


    </div>


</main>


<!-- ONLY ONE SCRIPT -->

<script src="/js/script.js"></script>


</body>

</html>

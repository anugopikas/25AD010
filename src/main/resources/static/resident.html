<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VisitorPass - Residents</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>


<header class="header">

    <div class="logo">
        VisitorPass
    </div>

    <div class="subtitle">
        Resident Management
    </div>

</header>


<nav class="navbar">

    <a href="/index.html">Dashboard</a>

    <a href="/resident.html">Residents</a>

    <a href="/visitor.html">Visitors</a>

    <a href="/gate.html">Gate Verification</a>

    <a href="/entry.html">Entry / Exit</a>

    <a href="/guard.html">Security Guards</a>

</nav>


<main class="container">


    <div class="card">

        <h2>
            Add Resident
        </h2>


        <form id="residentForm">

            <div class="form-grid">


                <input
                        type="text"
                        id="residentName"
                        placeholder="Resident Name"
                        required>


                <input
                        type="text"
                        id="residentPhone"
                        placeholder="Phone Number"
                        required>


                <input
                        type="email"
                        id="residentEmail"
                        placeholder="Email">


                <input
                        type="number"
                        id="residentFlat"
                        placeholder="Flat ID"
                        required>


            </div>


            <br>


            <button
                    type="submit">

                Add Resident

            </button>

        </form>

    </div>



    <div class="card">

        <h2>
            Residents
        </h2>


        <div class="table-wrapper">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Phone</th>

                    <th>Email</th>

                    <th>Flat ID</th>

                </tr>

                </thead>


                <tbody id="residentTableBody">

                </tbody>

            </table>

        </div>

    </div>


</main>


<script src="/js/script.js"></script>

</body>

</html>
